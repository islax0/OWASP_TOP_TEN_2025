name: composer-security-gates

on: [pull_request]

permissions:
  contents: read          # least privilege for GITHUB_TOKEN
  pull-requests: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned by SHA

      # the PR diff IS the supply-chain change - gate it first
      - name: Composer guard (scripts/repos/allow-plugins/typosquat/dists)
        run: |
          git fetch origin ${{ github.base_ref }} --no-tags
          git checkout -b base origin/${{ github.base_ref }} --detach >/dev/null
          git checkout - # restore PR head -- guard runs with ci mode
          php composer-guard.php ci || {
            echo "::error::composer.json/lock changed in a dangerous way - require security review"
            exit 1
          }

      # installs run with --no-scripts: a poisoned post-install-cmd never executes
      - name: composer install --no-scripts
        run: composer install --no-scripts --no-interaction --prefer-dist

      - name: validate manifest + lock consistency
        run: composer validate --strict --no-check-publish

      - name: audit advisories + abandoned
        run: composer audit --locked --abandoned=fail --format=table
